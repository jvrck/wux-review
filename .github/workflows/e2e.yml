name: E2E

on:
  pull_request:
    branches: [main, "epic/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-smoke:
    name: Compiled binary smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install the released Wux 2026.08.17 fixture
        env:
          WUX_VERSION: 2026.08.17
          BIN_DIR: ${{ runner.temp }}/wux-owner-contract-bin
        run: |
          curl -fsSL https://raw.githubusercontent.com/jvrck/wux/2026.08.17/install.sh \
            -o "${{ runner.temp }}/wux-install.sh"
          printf '%s  %s\n' \
            adfd7d347f02e805980f4abcbf42fbbb92dff2cb102e0ef58c70ac5a9e086177 \
            "${{ runner.temp }}/wux-install.sh" | sha256sum -c -
          bash "${{ runner.temp }}/wux-install.sh"
      - name: Verify the released Wux cleanup-actor contract
        env:
          WUX_OWNER_CONTRACT_BIN: ${{ runner.temp }}/wux-owner-contract-bin/wux
          WUX_OWNER_CONTRACT_VERSION: 2026.08.17
          WUX_OWNER_CONTRACT_ROOT: ${{ runner.temp }}/wux-owner-contract
        run: scripts/smoke-released-wux-owner.sh
      - name: Run installer E2E against the local build
        env:
          WUX_REVIEW_SOURCE_BIN: ${{ github.workspace }}/dist/wux-review
          EXPECTED_VERSION: 0.0.0-dev
          WUX_INSTALL_SMOKE_ROOT: ${{ runner.temp }}/wux-review-install-smoke
          WUX_INSTALL_SMOKE_DIAG_DIR: ${{ runner.temp }}/diagnostics/install
        run: scripts/smoke-installer.sh
      - name: Run fake-agent headless smoke
        env:
          WUX_REVIEW_BIN: ${{ github.workspace }}/dist/wux-review
          WUX_FAKE_SMOKE_ROOT: ${{ runner.temp }}/wux-review-fake-agent-smoke
          WUX_FAKE_SMOKE_DIAG_DIR: ${{ runner.temp }}/diagnostics/fake-agent
        run: scripts/smoke-fake-agent-wux.sh
      - name: Run real-Wux observable smoke with fake reviewers
        env:
          WUX_REVIEW_BIN: ${{ github.workspace }}/dist/wux-review
          WUX_REAL_SMOKE_WUX_BIN: ${{ runner.temp }}/wux-owner-contract-bin/wux
          WUX_REAL_SMOKE_WUX_VERSION: 2026.08.17
          WUX_REAL_SMOKE_ROOT: ${{ runner.temp }}/wux-review-real-wux-smoke
          WUX_REAL_SMOKE_DIAG_DIR: ${{ runner.temp }}/diagnostics/real-wux
        run: scripts/smoke-real-wux-observable.sh
      - name: Upload diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-install-diagnostics
          path: |
            ${{ runner.temp }}/diagnostics/install
            ${{ runner.temp }}/diagnostics/fake-agent
            ${{ runner.temp }}/diagnostics/real-wux
          if-no-files-found: ignore
          retention-days: 14
