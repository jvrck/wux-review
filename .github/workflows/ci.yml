name: CI
on:
  push:
    branches: [main, "epic/**"]
  pull_request:
    branches: [main, "epic/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: bun install --frozen-lockfile
      - run: bun run check:large-files
      - run: bun run typecheck
      - run: bun test
