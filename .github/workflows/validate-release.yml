name: Validate Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, for example 2026.06.12 or 2026.06.12.2
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-native:
    name: Validate ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: wux-review-linux-x64
            os: ubuntu-latest
          - asset: wux-review-linux-arm64
            os: ubuntu-24.04-arm
          - asset: wux-review-darwin-arm64
            os: macos-15
    env:
      TAG: ${{ inputs.tag }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::release tag must be CalVer YYYY.MM.DD or YYYY.MM.DD.N: $TAG"
            exit 1
          fi
      - name: Download and verify asset
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets/$ASSET"
          mkdir -p "$asset_dir"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" \
            --pattern SHA256SUMS \
            --dir "$asset_dir" \
            --clobber
          test -s "$asset_dir/$ASSET"
          test -s "$asset_dir/SHA256SUMS"
          (
            cd "$asset_dir"
            grep -E "[[:space:]]\*?$ASSET$" SHA256SUMS > SHA256SUMS.one
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c SHA256SUMS.one
            else
              shasum -a 256 -c SHA256SUMS.one
            fi
            chmod 0755 "$ASSET"
          )
          printf 'asset_dir=%s\n' "$asset_dir" >> "$GITHUB_OUTPUT"
      - name: Verify Darwin signature
        if: matrix.asset == 'wux-review-darwin-arm64'
        shell: bash
        run: scripts/verify-darwin-signature.sh "${{ steps.release.outputs.asset_dir }}/$ASSET"
      - name: Verify version and smoke
        shell: bash
        run: |
          set -euo pipefail
          asset_path="${{ steps.release.outputs.asset_dir }}/$ASSET"
          test "$("$asset_path" --version)" = "${TAG#v}"
          WUX_REVIEW_BIN="$asset_path" EXPECTED_VERSION="$TAG" scripts/smoke-release-asset.sh

  validate-linux-musl:
    name: Validate ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: wux-review-linux-x64-musl
            image: alpine:3.20
    env:
      TAG: ${{ inputs.tag }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::release tag must be CalVer YYYY.MM.DD or YYYY.MM.DD.N: $TAG"
            exit 1
          fi
      - name: Download and verify asset
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets/$ASSET"
          mkdir -p "$asset_dir"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" \
            --pattern SHA256SUMS \
            --dir "$asset_dir" \
            --clobber
          test -s "$asset_dir/$ASSET"
          (
            cd "$asset_dir"
            grep -E "[[:space:]]\*?$ASSET$" SHA256SUMS > SHA256SUMS.one
            sha256sum -c SHA256SUMS.one
            chmod 0755 "$ASSET"
          )
          printf 'asset_dir=%s\n' "$asset_dir" >> "$GITHUB_OUTPUT"
      - name: Alpine verify and smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e RELEASE_ASSET="/release/$ASSET" \
            -e EXPECTED_VERSION="$TAG" \
            -v "${{ steps.release.outputs.asset_dir }}:/release:ro" \
            -v "$PWD/scripts:/scripts:ro" \
            ${{ matrix.image }} \
            sh -euxc '
              apk add --no-cache bash coreutils libstdc++
              cp "$RELEASE_ASSET" /tmp/wux-review
              chmod 0755 /tmp/wux-review
              test "$(/tmp/wux-review --version)" = "${EXPECTED_VERSION#v}"
              WUX_REVIEW_BIN=/tmp/wux-review /scripts/smoke-release-asset.sh
            '
