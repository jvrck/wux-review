name: Dependency Security

on:
  pull_request:
    branches: [main, "epic/**"]
  push:
    branches: [main, "epic/**"]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency scan (reporting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Verify lockfile form
        run: test -f bun.lock && ! test -f bun.lockb
      - name: Install security scanners
        run: scripts/install-security-tools.sh
      - name: OSV-Scanner lockfile scan
        continue-on-error: true
        run: osv-scanner scan source --lockfile=bun.lock --config=osv-scanner.toml --format=sarif --output=osv-results.sarif
      - name: Trivy filesystem scan
        continue-on-error: true
        run: trivy fs --scanners vuln --include-dev-deps --ignorefile .trivyignore.yaml --format sarif --output trivy-results.sarif .
      - name: Upload security scan reports
        if: always()
        # The SARIF upload is a reporting nicety, not a gate. Don't let a failed
        # upload (e.g. the Actions artifact-storage quota) fail the job — the real
        # HIGH/CRITICAL gate is the separate security-gate job.
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dependency-security-reports
          path: |
            osv-results.sarif
            trivy-results.sarif
          if-no-files-found: ignore
          retention-days: 14

  security-gate:
    name: HIGH/CRITICAL fixable gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Verify lockfile form
        run: test -f bun.lock && ! test -f bun.lockb
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install security scanners
        run: scripts/install-security-tools.sh
      - name: Block fixable high and critical vulnerabilities
        run: trivy fs --scanners vuln --include-dev-deps --ignorefile .trivyignore.yaml --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - name: Block dependency licenses incompatible with MIT
        # Trivy maps permissive/notice/unencumbered licenses to LOW. Reciprocal,
        # restricted, forbidden, and unidentified licenses are MEDIUM, HIGH,
        # CRITICAL, and UNKNOWN respectively, so all require a human decision.
        run: bun run security:license
